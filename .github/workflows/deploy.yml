name: Deploy landing a GitHub Pages

# Publica la landing en https://gentlevanguard.github.io/
# Habilita Pages automáticamente en el primer run (configure-pages: enablement).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (habilita si no existe)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deployar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
